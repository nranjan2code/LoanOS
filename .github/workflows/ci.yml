name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  rules-engine:
    name: Rules engine (Rust)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: rules
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: rules
      - run: cargo fmt --all --check
      # clippy.toml disallows f32/f64 on eval-path crates (INV-6 float-deny lane).
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace
      - name: cargo audit
        run: |
          cargo install cargo-audit --locked
          cargo audit

  test:
    name: Test (file store)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # depth 2 so the currency advisory can diff HEAD~1..HEAD
          fetch-depth: 2
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
      - run: npm ci
      - name: Documentation integrity gate
        run: npm run docs:check
      - name: Capability evidence integrity gate
        run: npm run trace:validate
      - name: Knowledge-graph integrity gate
        run: npm run graph:check
      - name: Dashboard source and artifact integrity gate
        run: npm run dashboard:check
      - name: Public-site content gate
        run: npm run web:content:check
      - name: Eligibility differential corpus is in sync
        # Regenerates the corpus from the JS policy; fails if the committed
        # fixture drifted (would let JS and the Rust engine diverge silently).
        run: npm run corpus:check
      - name: Documentation currency advisory (non-blocking)
        run: npm run currency:check -- --base HEAD~1
      - run: npm test

  android:
    name: Android apps (field-ops, dsa-ops)
    runs-on: ubuntu-latest
    strategy:
      matrix:
        app: [android-field-ops, android-dsa-ops]
    defaults:
      run:
        working-directory: apps/${{ matrix.app }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: android-actions/setup-android@v3
      - run: sdkmanager "platforms;android-34" "build-tools;34.0.0"
      - run: chmod +x gradlew
      - run: ./gradlew assembleDebug --console=plain
      - run: ./gradlew lintDebug --console=plain

  test-postgres:
    name: Test (Postgres/RLS driver)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: postgres
          POSTGRES_DB: loanos_test
          # Trust auth: the test connects as the superuser (to apply the schema
          # and create roles) AND, on a second pool, as loanos_control_plane
          # with no password (rewriteRole drops it). A disposable CI database
          # authenticates every role by trust so both connections succeed.
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      # Presence of DATABASE_URL_TEST un-skips tests/postgres-store.test.js,
      # which applies db/schema.sql (including the two-role model) itself as
      # the superuser, then re-connects as loanos_control_plane for the
      # RLS-scoped assertions.
      DATABASE_URL_TEST: postgres://postgres@localhost:5432/loanos_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
      - run: npm ci
      - run: npm test
