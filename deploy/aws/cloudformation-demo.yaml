AWSTemplateFormatVersion: "2010-09-09"
Description: >-
  LoanOS India generation-2 synthetic showcase host. Creates one encrypted
  EC2 instance, immutable application releases, Systems Manager access,
  canonical browser-app subdomains, an HTTP security group, and a cost
  budget. This is not a production or real-borrower-data deployment.

Parameters:
  AlertEmail:
    Type: String
    Description: Email address that receives AWS Budget notifications.
    AllowedPattern: "^[^@\\s]+@[^@\\s]+\\.[^@\\s]+$"
  SourceBucket:
    Type: String
    Description: Existing private S3 bucket containing the packaged LoanOS source archive.
    AllowedPattern: "^[a-z0-9][a-z0-9.-]{1,61}[a-z0-9]$"
  SourceKey:
    Type: String
    AllowedPattern: "^[A-Za-z0-9!_.*'()/-]+$"
    Description: Object key of the source archive generated by package-demo.sh.
  SourceSha256:
    Type: String
    AllowedPattern: "^[a-f0-9]{64}$"
    Description: SHA-256 digest verified before the initial archive is extracted.
  ReleaseId:
    Type: String
    AllowedPattern: "^[A-Za-z0-9._-]{7,64}$"
    Description: Immutable release identifier, normally the full Git commit SHA.
  InstanceType:
    Type: String
    Default: t3.small
    AllowedValues: [t3.micro, t3.small]
    Description: t3.small is recommended while compiling the Rust engine.
  MonthlyBudgetUsd:
    Type: Number
    Default: 25
    MinValue: 1
    MaxValue: 100
  LatestUbuntuAmi:
    Type: AWS::SSM::Parameter::Value<AWS::EC2::Image::Id>
    Default: /aws/service/canonical/ubuntu/server/24.04/stable/current/amd64/hvm/ebs-gp3/ami-id
  DomainRoot:
    Type: String
    Default: ""
    AllowedPattern: "^$|^(?=.{1,253}$)([a-z0-9](?:[a-z0-9-]{0,61}[a-z0-9])?\\.)+[a-z]{2,63}$"
    Description: >-
      Optional DNS root. The stack serves demo, staff, portal, partners,
      admin, and help as one-level subdomains of this root.
  AcmCertificateArn:
    Type: String
    Default: ""
    AllowedPattern: "^$|^arn:aws[a-zA-Z-]*:acm:us-east-1:[0-9]{12}:certificate/[A-Za-z0-9-]+$"
    Description: Optional wildcard ACM certificate ARN from us-east-1 covering DomainRoot subdomains.

Rules:
  DomainParametersMustBePaired:
    Assertions:
      - Assert: !Or
          - !And
            - !Equals [!Ref DomainRoot, ""]
            - !Equals [!Ref AcmCertificateArn, ""]
          - !And
            - !Not [!Equals [!Ref DomainRoot, ""]]
            - !Not [!Equals [!Ref AcmCertificateArn, ""]]
        AssertDescription: DomainRoot and AcmCertificateArn must either both be supplied or both be empty.

Conditions:
  HasCustomDomain: !Not [!Equals [!Ref DomainRoot, ""]]

Resources:
  DemoBudget:
    Type: AWS::Budgets::Budget
    Properties:
      Budget:
        BudgetName: !Sub "${AWS::StackName}-monthly-cost"
        BudgetLimit:
          Amount: !Ref MonthlyBudgetUsd
          Unit: USD
        BudgetType: COST
        TimeUnit: MONTHLY
      NotificationsWithSubscribers:
        - Notification:
            ComparisonOperator: GREATER_THAN
            NotificationType: FORECASTED
            Threshold: 50
            ThresholdType: PERCENTAGE
          Subscribers:
            - Address: !Ref AlertEmail
              SubscriptionType: EMAIL
        - Notification:
            ComparisonOperator: GREATER_THAN
            NotificationType: ACTUAL
            Threshold: 80
            ThresholdType: PERCENTAGE
          Subscribers:
            - Address: !Ref AlertEmail
              SubscriptionType: EMAIL
        - Notification:
            ComparisonOperator: GREATER_THAN
            NotificationType: ACTUAL
            Threshold: 100
            ThresholdType: PERCENTAGE
          Subscribers:
            - Address: !Ref AlertEmail
              SubscriptionType: EMAIL

  DemoInstanceRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service: ec2.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/AmazonSSMManagedInstanceCore
      Policies:
        - PolicyName: PublishDemoBootstrapStatus
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action:
                  - ssm:PutParameter
                Resource: !Sub "arn:${AWS::Partition}:ssm:${AWS::Region}:${AWS::AccountId}:parameter/loanos-demo/${AWS::StackName}/*"
              - Effect: Allow
                Action: s3:GetObject
                Resource: !Sub "arn:${AWS::Partition}:s3:::${SourceBucket}/releases/*"

  DemoInstanceProfile:
    Type: AWS::IAM::InstanceProfile
    Properties:
      Roles: [!Ref DemoInstanceRole]

  DemoVpc:
    Type: AWS::EC2::VPC
    Properties:
      CidrBlock: 10.42.0.0/24
      EnableDnsHostnames: true
      EnableDnsSupport: true
      Tags:
        - Key: Name
          Value: !Sub "${AWS::StackName}-vpc"

  DemoInternetGateway:
    Type: AWS::EC2::InternetGateway

  DemoGatewayAttachment:
    Type: AWS::EC2::VPCGatewayAttachment
    Properties:
      InternetGatewayId: !Ref DemoInternetGateway
      VpcId: !Ref DemoVpc

  DemoSubnet:
    Type: AWS::EC2::Subnet
    Properties:
      AvailabilityZone: !Select [0, !GetAZs ""]
      CidrBlock: 10.42.0.0/26
      MapPublicIpOnLaunch: true
      VpcId: !Ref DemoVpc
      Tags:
        - Key: Name
          Value: !Sub "${AWS::StackName}-public"

  DemoRouteTable:
    Type: AWS::EC2::RouteTable
    Properties:
      VpcId: !Ref DemoVpc

  DemoDefaultRoute:
    Type: AWS::EC2::Route
    DependsOn: DemoGatewayAttachment
    Properties:
      DestinationCidrBlock: 0.0.0.0/0
      GatewayId: !Ref DemoInternetGateway
      RouteTableId: !Ref DemoRouteTable

  DemoSubnetRouteTableAssociation:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Properties:
      RouteTableId: !Ref DemoRouteTable
      SubnetId: !Ref DemoSubnet

  DemoSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: LoanOS demo HTTP access; administration uses SSM, not SSH
      VpcId: !Ref DemoVpc
      SecurityGroupIngress:
        - IpProtocol: tcp
          FromPort: 80
          ToPort: 80
          CidrIp: 0.0.0.0/0
          Description: Synthetic demo web traffic
      Tags:
        - Key: Name
          Value: !Sub "${AWS::StackName}-web"
        - Key: LoanOS-Environment
          Value: demo

  DemoInstance:
    Type: AWS::EC2::Instance
    Properties:
      ImageId: !Ref LatestUbuntuAmi
      InstanceType: !Ref InstanceType
      IamInstanceProfile: !Ref DemoInstanceProfile
      SecurityGroupIds: [!GetAtt DemoSecurityGroup.GroupId]
      SubnetId: !Ref DemoSubnet
      BlockDeviceMappings:
        - DeviceName: /dev/sda1
          Ebs:
            DeleteOnTermination: true
            Encrypted: true
            VolumeSize: 24
            VolumeType: gp3
      MetadataOptions:
        HttpEndpoint: enabled
        HttpTokens: required
        HttpPutResponseHopLimit: 1
      Tags:
        - Key: Name
          Value: !Sub "${AWS::StackName}-host"
        - Key: LoanOS-Environment
          Value: demo
        - Key: DataClassification
          Value: synthetic-only
      UserData:
        Fn::Base64: !Sub |
          #!/bin/bash
          set -euo pipefail
          export DEBIAN_FRONTEND=noninteractive
          apt-get update
          apt-get install -y ca-certificates curl tar unzip
          curl --fail --show-error --silent --location \
            https://awscli.amazonaws.com/awscli-exe-linux-x86_64.zip \
            -o /tmp/awscliv2.zip
          unzip -q /tmp/awscliv2.zip -d /tmp
          /tmp/aws/install
          install -d -m 0755 /opt/loanos/releases
          RELEASE_DIR='/opt/loanos/releases/${ReleaseId}'
          install -d -m 0755 "$RELEASE_DIR"
          aws s3 cp 's3://${SourceBucket}/${SourceKey}' /tmp/loanos-source.tar.gz \
            --region '${AWS::Region}'
          printf '%s  %s\n' '${SourceSha256}' /tmp/loanos-source.tar.gz | sha256sum --check --status
          tar -xzf /tmp/loanos-source.tar.gz -C "$RELEASE_DIR"
          printf '%s\n' '${SourceSha256}' > "$RELEASE_DIR/.loanos-release-sha256"
          ln -sfn "$RELEASE_DIR" /opt/loanos/current
          chmod 0755 /opt/loanos/current/deploy/aws/bootstrap-demo.sh
          chmod 0755 /opt/loanos/current/deploy/aws/update-demo.sh
          export LOANOS_STACK_NAME='${AWS::StackName}'
          export LOANOS_AWS_REGION='${AWS::Region}'
          export LOANOS_APP_DIR=/opt/loanos/current
          export LOANOS_ORIGIN_TOKEN='${AWS::StackId}'
          export LOANOS_RELEASE_ID='${ReleaseId}'
          export LOANOS_SOURCE_KEY='${SourceKey}'
          export LOANOS_SOURCE_SHA256='${SourceSha256}'
          /opt/loanos/current/deploy/aws/bootstrap-demo.sh \
            > /var/log/loanos-bootstrap.log 2>&1

  DemoHostRouter:
    Type: AWS::CloudFront::Function
    Condition: HasCustomDomain
    Properties:
      AutoPublish: true
      Name: !Sub "${AWS::StackName}-host-router"
      FunctionConfig:
        Comment: Route LoanOS showcase subdomains to their canonical browser applications
        Runtime: cloudfront-js-2.0
      FunctionCode: !Sub |
        function handler(event) {
          var request = event.request;
          if (request.uri !== '/' && request.uri !== '/index.html') return request;
          var host = request.headers.host && request.headers.host.value
            ? request.headers.host.value.toLowerCase()
            : '';
          var routes = {
            'staff.${DomainRoot}': '/t/dev/staff/',
            'portal.${DomainRoot}': '/t/dev/portal/',
            'partners.${DomainRoot}': '/t/dev/partners/',
            'admin.${DomainRoot}': '/t/dev/staff/?scope=platform',
            'help.${DomainRoot}': '/help/'
          };
          if (!routes[host]) return request;
          return {
            statusCode: 302,
            statusDescription: 'Found',
            headers: {
              location: { value: routes[host] },
              'cache-control': { value: 'no-store' }
            }
          };
        }

  DemoDistribution:
    Type: AWS::CloudFront::Distribution
    Properties:
      DistributionConfig:
        Aliases: !If
          - HasCustomDomain
          - - !Sub "demo.${DomainRoot}"
            - !Sub "staff.${DomainRoot}"
            - !Sub "portal.${DomainRoot}"
            - !Sub "partners.${DomainRoot}"
            - !Sub "admin.${DomainRoot}"
            - !Sub "help.${DomainRoot}"
          - !Ref AWS::NoValue
        Comment: !Sub "${AWS::StackName} synthetic demo HTTPS entry point"
        Enabled: true
        HttpVersion: http2and3
        IPV6Enabled: true
        Origins:
          - Id: DemoEc2Origin
            DomainName: !GetAtt DemoInstance.PublicDnsName
            CustomOriginConfig:
              HTTPPort: 80
              OriginProtocolPolicy: http-only
            OriginCustomHeaders:
              - HeaderName: X-LoanOS-Origin-Token
                HeaderValue: !Ref AWS::StackId
        DefaultCacheBehavior:
          TargetOriginId: DemoEc2Origin
          ViewerProtocolPolicy: redirect-to-https
          AllowedMethods: [DELETE, GET, HEAD, OPTIONS, PATCH, POST, PUT]
          CachedMethods: [GET, HEAD]
          CachePolicyId: 4135ea2d-6df8-44a3-9df3-4b5a84be39ad
          OriginRequestPolicyId: 216adef6-5c7f-47e4-b989-5492eafa07d3
          Compress: true
          FunctionAssociations: !If
            - HasCustomDomain
            - - EventType: viewer-request
                FunctionARN: !GetAtt DemoHostRouter.FunctionARN
            - !Ref AWS::NoValue
        PriceClass: PriceClass_100
        ViewerCertificate: !If
          - HasCustomDomain
          - AcmCertificateArn: !Ref AcmCertificateArn
            MinimumProtocolVersion: TLSv1.2_2021
            SslSupportMethod: sni-only
          - CloudFrontDefaultCertificate: true

Outputs:
  DemoUrl:
    Description: HTTPS demo URL. Wait for both bootstrap COMPLETE and CloudFront deployment.
    Value: !Sub "https://${DemoDistribution.DomainName}/"
  CustomDemoUrl:
    Condition: HasCustomDomain
    Description: Custom HTTPS demo URL managed by this stack.
    Value: !Sub "https://demo.${DomainRoot}/"
  StaffUrl:
    Condition: HasCustomDomain
    Description: Tenant staff workspace entry point.
    Value: !Sub "https://staff.${DomainRoot}/"
  PortalUrl:
    Condition: HasCustomDomain
    Description: Borrower portal entry point.
    Value: !Sub "https://portal.${DomainRoot}/"
  PartnerUrl:
    Condition: HasCustomDomain
    Description: Partner workspace entry point.
    Value: !Sub "https://partners.${DomainRoot}/"
  PlatformAdminUrl:
    Condition: HasCustomDomain
    Description: Platform-administration login entry point.
    Value: !Sub "https://admin.${DomainRoot}/"
  HelpUrl:
    Condition: HasCustomDomain
    Description: Guide and Academy entry point.
    Value: !Sub "https://help.${DomainRoot}/"
  InstanceId:
    Description: Instance identifier for Systems Manager Session Manager.
    Value: !Ref DemoInstance
  CredentialsParameter:
    Description: >-
      SecureString parameter containing generated demo credentials. Retrieve
      it through Systems Manager Parameter Store after bootstrap completes.
    Value: !Sub "/loanos-demo/${AWS::StackName}/credentials"
  BootstrapStatusParameter:
    Description: Parameter reporting STARTED, COMPLETE, or FAILED.
    Value: !Sub "/loanos-demo/${AWS::StackName}/status"
  ReleaseStatusParameter:
    Description: Parameter reporting in-place release installation state.
    Value: !Sub "/loanos-demo/${AWS::StackName}/release-status"
  ReleaseParameter:
    Description: JSON metadata for the currently installed immutable release.
    Value: !Sub "/loanos-demo/${AWS::StackName}/release"
  DeploymentGeneration:
    Description: Release-layout compatibility marker used by release-demo.sh.
    Value: "2"
  BootstrapLogCommand:
    Description: Run inside an SSM session if bootstrap troubleshooting is needed.
    Value: sudo tail -n 200 /var/log/loanos-bootstrap.log
