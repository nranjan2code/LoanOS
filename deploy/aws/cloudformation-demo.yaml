AWSTemplateFormatVersion: "2010-09-09"
Description: >-
  LoanOS India synthetic-data demo host. Creates one encrypted EC2 instance,
  Systems Manager access, an HTTP security group, and a cost budget. This is
  not a production or real-borrower-data deployment.

Parameters:
  AlertEmail:
    Type: String
    Description: Email address that receives AWS Budget notifications.
    AllowedPattern: "^[^@\\s]+@[^@\\s]+\\.[^@\\s]+$"
  SourceBucket:
    Type: String
    Description: Existing private S3 bucket containing the packaged LoanOS source archive.
    AllowedPattern: "^[a-z0-9][a-z0-9.-]{1,61}[a-z0-9]$"
  SourceKey:
    Type: String
    Default: loanos-demo-source.tar.gz
    AllowedPattern: "^[A-Za-z0-9!_.*'()/-]+$"
    Description: Object key of the source archive generated by package-demo.sh.
  InstanceType:
    Type: String
    Default: t3.small
    AllowedValues: [t3.micro, t3.small]
    Description: t3.small is recommended while compiling the Rust engine.
  MonthlyBudgetUsd:
    Type: Number
    Default: 25
    MinValue: 1
    MaxValue: 100
  LatestUbuntuAmi:
    Type: AWS::SSM::Parameter::Value<AWS::EC2::Image::Id>
    Default: /aws/service/canonical/ubuntu/server/24.04/stable/current/amd64/hvm/ebs-gp3/ami-id

Resources:
  DemoBudget:
    Type: AWS::Budgets::Budget
    Properties:
      Budget:
        BudgetName: !Sub "${AWS::StackName}-monthly-cost"
        BudgetLimit:
          Amount: !Ref MonthlyBudgetUsd
          Unit: USD
        BudgetType: COST
        TimeUnit: MONTHLY
      NotificationsWithSubscribers:
        - Notification:
            ComparisonOperator: GREATER_THAN
            NotificationType: FORECASTED
            Threshold: 50
            ThresholdType: PERCENTAGE
          Subscribers:
            - Address: !Ref AlertEmail
              SubscriptionType: EMAIL
        - Notification:
            ComparisonOperator: GREATER_THAN
            NotificationType: ACTUAL
            Threshold: 80
            ThresholdType: PERCENTAGE
          Subscribers:
            - Address: !Ref AlertEmail
              SubscriptionType: EMAIL
        - Notification:
            ComparisonOperator: GREATER_THAN
            NotificationType: ACTUAL
            Threshold: 100
            ThresholdType: PERCENTAGE
          Subscribers:
            - Address: !Ref AlertEmail
              SubscriptionType: EMAIL

  DemoInstanceRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service: ec2.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/AmazonSSMManagedInstanceCore
      Policies:
        - PolicyName: PublishDemoBootstrapStatus
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action:
                  - ssm:PutParameter
                Resource: !Sub "arn:${AWS::Partition}:ssm:${AWS::Region}:${AWS::AccountId}:parameter/loanos-demo/${AWS::StackName}/*"
              - Effect: Allow
                Action: s3:GetObject
                Resource: !Sub "arn:${AWS::Partition}:s3:::${SourceBucket}/${SourceKey}"

  DemoInstanceProfile:
    Type: AWS::IAM::InstanceProfile
    Properties:
      Roles: [!Ref DemoInstanceRole]

  DemoVpc:
    Type: AWS::EC2::VPC
    Properties:
      CidrBlock: 10.42.0.0/24
      EnableDnsHostnames: true
      EnableDnsSupport: true
      Tags:
        - Key: Name
          Value: !Sub "${AWS::StackName}-vpc"

  DemoInternetGateway:
    Type: AWS::EC2::InternetGateway

  DemoGatewayAttachment:
    Type: AWS::EC2::VPCGatewayAttachment
    Properties:
      InternetGatewayId: !Ref DemoInternetGateway
      VpcId: !Ref DemoVpc

  DemoSubnet:
    Type: AWS::EC2::Subnet
    Properties:
      AvailabilityZone: !Select [0, !GetAZs ""]
      CidrBlock: 10.42.0.0/26
      MapPublicIpOnLaunch: true
      VpcId: !Ref DemoVpc
      Tags:
        - Key: Name
          Value: !Sub "${AWS::StackName}-public"

  DemoRouteTable:
    Type: AWS::EC2::RouteTable
    Properties:
      VpcId: !Ref DemoVpc

  DemoDefaultRoute:
    Type: AWS::EC2::Route
    DependsOn: DemoGatewayAttachment
    Properties:
      DestinationCidrBlock: 0.0.0.0/0
      GatewayId: !Ref DemoInternetGateway
      RouteTableId: !Ref DemoRouteTable

  DemoSubnetRouteTableAssociation:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Properties:
      RouteTableId: !Ref DemoRouteTable
      SubnetId: !Ref DemoSubnet

  DemoSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: LoanOS demo HTTP access; administration uses SSM, not SSH
      VpcId: !Ref DemoVpc
      SecurityGroupIngress:
        - IpProtocol: tcp
          FromPort: 80
          ToPort: 80
          CidrIp: 0.0.0.0/0
          Description: Synthetic demo web traffic
      Tags:
        - Key: Name
          Value: !Sub "${AWS::StackName}-web"
        - Key: LoanOS-Environment
          Value: demo

  DemoInstance:
    Type: AWS::EC2::Instance
    Properties:
      ImageId: !Ref LatestUbuntuAmi
      InstanceType: !Ref InstanceType
      IamInstanceProfile: !Ref DemoInstanceProfile
      SecurityGroupIds: [!GetAtt DemoSecurityGroup.GroupId]
      SubnetId: !Ref DemoSubnet
      BlockDeviceMappings:
        - DeviceName: /dev/sda1
          Ebs:
            DeleteOnTermination: true
            Encrypted: true
            VolumeSize: 24
            VolumeType: gp3
      MetadataOptions:
        HttpEndpoint: enabled
        HttpTokens: required
        HttpPutResponseHopLimit: 1
      Tags:
        - Key: Name
          Value: !Sub "${AWS::StackName}-host"
        - Key: LoanOS-Environment
          Value: demo
        - Key: DataClassification
          Value: synthetic-only
      UserData:
        Fn::Base64: !Sub |
          #!/bin/bash
          set -euo pipefail
          export DEBIAN_FRONTEND=noninteractive
          apt-get update
          apt-get install -y ca-certificates curl tar unzip
          curl --fail --show-error --silent --location \
            https://awscli.amazonaws.com/awscli-exe-linux-x86_64.zip \
            -o /tmp/awscliv2.zip
          unzip -q /tmp/awscliv2.zip -d /tmp
          /tmp/aws/install
          install -d -m 0755 /opt/loanos/app
          aws s3 cp 's3://${SourceBucket}/${SourceKey}' /tmp/loanos-source.tar.gz \
            --region '${AWS::Region}'
          tar -xzf /tmp/loanos-source.tar.gz -C /opt/loanos/app
          chmod 0755 /opt/loanos/app/deploy/aws/bootstrap-demo.sh
          export LOANOS_STACK_NAME='${AWS::StackName}'
          export LOANOS_AWS_REGION='${AWS::Region}'
          export LOANOS_APP_DIR=/opt/loanos/app
          export LOANOS_ORIGIN_TOKEN='${AWS::StackId}'
          /opt/loanos/app/deploy/aws/bootstrap-demo.sh \
            > /var/log/loanos-bootstrap.log 2>&1

  DemoDistribution:
    Type: AWS::CloudFront::Distribution
    Properties:
      DistributionConfig:
        Comment: !Sub "${AWS::StackName} synthetic demo HTTPS entry point"
        Enabled: true
        HttpVersion: http2and3
        IPV6Enabled: true
        Origins:
          - Id: DemoEc2Origin
            DomainName: !GetAtt DemoInstance.PublicDnsName
            CustomOriginConfig:
              HTTPPort: 80
              OriginProtocolPolicy: http-only
            OriginCustomHeaders:
              - HeaderName: X-LoanOS-Origin-Token
                HeaderValue: !Ref AWS::StackId
        DefaultCacheBehavior:
          TargetOriginId: DemoEc2Origin
          ViewerProtocolPolicy: redirect-to-https
          AllowedMethods: [DELETE, GET, HEAD, OPTIONS, PATCH, POST, PUT]
          CachedMethods: [GET, HEAD]
          CachePolicyId: 4135ea2d-6df8-44a3-9df3-4b5a84be39ad
          OriginRequestPolicyId: 216adef6-5c7f-47e4-b989-5492eafa07d3
          Compress: true
        PriceClass: PriceClass_100

Outputs:
  DemoUrl:
    Description: HTTPS demo URL. Wait for both bootstrap COMPLETE and CloudFront deployment.
    Value: !Sub "https://${DemoDistribution.DomainName}/"
  InstanceId:
    Description: Instance identifier for Systems Manager Session Manager.
    Value: !Ref DemoInstance
  CredentialsParameter:
    Description: >-
      SecureString parameter containing generated demo credentials. Retrieve
      it through Systems Manager Parameter Store after bootstrap completes.
    Value: !Sub "/loanos-demo/${AWS::StackName}/credentials"
  BootstrapStatusParameter:
    Description: Parameter reporting STARTED, COMPLETE, or FAILED.
    Value: !Sub "/loanos-demo/${AWS::StackName}/status"
  BootstrapLogCommand:
    Description: Run inside an SSM session if bootstrap troubleshooting is needed.
    Value: sudo tail -n 200 /var/log/loanos-bootstrap.log
