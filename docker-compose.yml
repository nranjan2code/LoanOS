# Local Postgres-backed LoanOS stack. Brings up the API on the Postgres/RLS
# storage driver against a Postgres 18 instance seeded from db/schema.sql.
# For the default file-store driver, run the api service without the postgres
# env overrides (or use `node apps/api/src/server.js` directly).
services:
  postgres:
    image: postgres:18
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: loanos
    ports:
      - "5432:5432"
    volumes:
      - loanos-pg:/var/lib/postgresql/data
      # Applied once on first init: creates tables, RLS policies, and the
      # two-role model (loanos_control_plane / loanos_app).
      - ./db/schema.sql:/docker-entrypoint-initdb.d/10-schema.sql:ro
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

  api:
    build: .
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      NODE_ENV: production
      PORT: "3040"
      LOANOS_STORAGE_DRIVER: postgres
      # The app authenticates as loanos_control_plane (BYPASSRLS) and SET ROLEs
      # to loanos_app for per-tenant statements — see db/schema.sql.
      DATABASE_URL: postgres://loanos_control_plane@postgres:5432/loanos
      LOANOS_PLATFORM_ADMIN_KEY: ${LOANOS_PLATFORM_ADMIN_KEY:-platform-admin-key}
    ports:
      - "3040:3040"

  # Explicitly non-commercial worker used to exercise the complete durable
  # scheduler protocol before a certified IdP/directory adapter is selected.
  # It is opt-in so a default production-shaped stack cannot mistake simulator
  # completion for live provider evidence.
  identity-worker-simulator:
    profiles: ["identity-simulator"]
    build: .
    command: ["node", "scripts/run-identity-operations-worker.mjs"]
    depends_on:
      api:
        condition: service_healthy
    environment:
      NODE_ENV: production
      LOANOS_API_URL: http://api:3040
      LOANOS_IDENTITY_WORKER_API_KEY: ${LOANOS_IDENTITY_WORKER_API_KEY:?Set a tenant-bound worker API key}
      LOANOS_IDENTITY_WORKER_ID: ${LOANOS_IDENTITY_WORKER_ID:-identity-worker-simulator-1}
      LOANOS_IDENTITY_WORKER_EXECUTION_MODE: simulated
      LOANOS_ALLOW_SIMULATED_IDENTITY_WORKER: "true"
      LOANOS_IDENTITY_WORKER_MAX_JOBS: ${LOANOS_IDENTITY_WORKER_MAX_JOBS:-25}
      LOANOS_IDENTITY_WORKER_LEASE_MS: ${LOANOS_IDENTITY_WORKER_LEASE_MS:-30000}
      LOANOS_IDENTITY_WORKER_JOB_TIMEOUT_MS: ${LOANOS_IDENTITY_WORKER_JOB_TIMEOUT_MS:-10000}
      LOANOS_IDENTITY_WORKER_INTERVAL_MS: ${LOANOS_IDENTITY_WORKER_INTERVAL_MS:-15000}
      LOANOS_IDENTITY_WORKER_HEALTH_PORT: "3041"
    ports:
      - "3041:3041"
    restart: unless-stopped


volumes:
  loanos-pg:
